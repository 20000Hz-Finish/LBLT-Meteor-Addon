plugins {
    id "fabric-loom" version "1.14-SNAPSHOT"
}

base {
    archivesName = project.archives_base_name
    version = project.mod_version
    group = project.maven_group
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // QR-code generation used by the music login screen.
    include(implementation("com.google.zxing:core:${project.zxing_version}"))
    include(implementation("com.googlecode.soundlibs:mp3spi:${project.mp3spi_version}"))
    include(implementation("com.googlecode.soundlibs:jlayer:${project.jlayer_version}"))
    include(implementation("com.googlecode.soundlibs:tritonus-share:${project.tritonus_version}"))

    // Meteor
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks {
    processResources {
        inputs.property "version", project.version
        inputs.property "mc_version", project.minecraft_version

        filesMatching("fabric.mod.json") {
            expand(
                version: project.version,
                mc_version: project.minecraft_version
            )
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.archives_base_name}" }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}
